apiVersion: batch/v1
kind: Job
metadata:
  name: cardio-rodrigo-cuda113-03
  namespace: rbonazzola
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  selector:
    matchLabels:
  template:
    metadata:
      annotations:
      labels:
        job-name: cardio-rodrigo-cuda113-03
    spec:
      containers:
      - image: rbonazzola/coma4d:cuda113
        imagePullPolicy: Always
        name: cardio-rodrigo-cuda113-03
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            memory: 8000Mi
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /MULTIX/DATA/
          name: vol1
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - hostPath:
          path: /mnt/data/datasets/test/rodrigo/
          type: ""
        name: vol1
